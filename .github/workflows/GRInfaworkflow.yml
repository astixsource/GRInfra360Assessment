name: CI/CD Pipeline for ASP.NET Web App

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch

jobs:
  # Continuous Integration Job
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

        # Step 3: Verify directory structure (Debugging step)
      - name: List Files in Workspace
        run: |
          echo "Listing workspace files..."
          Get-ChildItem -Path D:\a\GRInfra360Assessment -Recurse

      # Step 4: Create missing directory (if required)
      - name: Ensure Required Directory Exists
        run: |
          if (!(Test-Path "D:\a\GRInfra360Assessment\GRInfratech360")) {
            New-Item -Path "D:\a\GRInfra360Assessment\GRInfratech360" -ItemType Directory
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      - name: Restore NuGet packages
        run: nuget restore GRInfratech360.sln
        
      - name: Clean Solution
        run: msbuild GRInfratech360.sln /t:Clean
        
      - name: Build the solution
        run: msbuild GRInfratech360.sln /nologo /verbosity:m /p:Configuration=Release

# Step 6: Ensure Publish Directory Exists (Fix Error)
      - name: Ensure Publish Directory Exists
        run: |
          if (!(Test-Path "D:\a\published")) {
            New-Item -Path "D:\a\published" -ItemType Directory
          }
      #- name: Run Unit Tests
      #  run: dotnet test GRInfratech360.sln --logger "trx;LogFileName=TestResults.trx" --verbosity normal

  # Continuous Deployment Job with Manual Approval
  deploy:
    needs: build-and-test  # Runs only if CI job succeeds
    runs-on: windows-latest
    #environment: Production  # This is where manual approval is required
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Publish to folder
        run: msbuild GRInfratech360.sln /nologo /verbosity:m /t:Build /t:pipelinePreDeployCopyAllFilesToOneFolder /p:_PackageTempDir="published"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          # creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'wa-del01-GRInfra360-prod'
          slot-name: 'Production'
          package: ./
